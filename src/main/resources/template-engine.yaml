messages:
  aar-radd:
    pf:
      it: "string AVVISO DI AVVENUTA RICEZIONE Identificativo Univoco Notifica: string Codice fiscale - Persona giuridica: string Inviata tramite notifichedigitali.it Hai ricevuto una comunicazione a valore legale da string con oggetto: string Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCEDI ORA AI DOCUMENTI ONLINE Consultazione online gratuita Inquadra il con la fotocamera del tuo dispositivo oppure vai sul sito web codice QR string Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Se previsto un pagamento, puoi pagare con tutti i canali abilitati a pagoPA L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su string COME SFRUTTARE TUTTI I VANTAGGI DI SEND - SERVIZIO NOTIFICHE DIGITALI? SEND è il servizio che semplifica l'invio delle comunicazioni a valore legale della Pubblica Amministrazione. Grazie a SEND puoi consultare le notifiche in digitale ed evitare le raccomandate e i relativi costi. Ti avvisiamo sui tuoi canali preferiti Aggiungi i tuoi recapiti per ricevere un avviso quando c'è una notifica per te Consulta i documenti online Accedi ai documenti online comodamente dal tuo dispositivo Eviti i costi di raccomandata Se accedi in tempo, eviti l'invio della raccomandata e i relativi costi Configura SEND accedendo alla tua area personale su: string"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Einheitlicher Kodex: Identificativo Univoco Notifica: string Steuernummer | Codice fiscale: string Gesendet von Inviata tramite notifichedigitali.it Du hast eine rechtsgültige Mitteilung von | Hai ricevuto una comunicazione a valore legale da string mit dem Betreff | con oggetto: string erhalten Nimm Kenntnis von der Kopie der beigefügten Dokumente oder greife online auf die Originaldokumente zu gemäß den Anweisungen. Beachte, dass der Inhalt der Mitteilung Rechtswirkungen für dich entfaltet, auch ohne dass du die Dokumente zur Kenntnis nimmst. Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. GREIFE ONLINE AUF DIE DOKUMENTE ZU KOSTENLOS | ACCEDI AI DOCUMENTI ONLINE GRATIS Scanne den mit der Kamera deines Geräts oder gehe zur Website | Inquadra QR-Code string il con la fotocamera del tuo dispositivo oppure vai sul sito web codice QR string Greife auf die Dokumente zu und lade sie herunter: sie enthalten wichtige Informationen für dich | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Ist eine Zahlung vorgesehen, können Sie online oder über die für pagoPA aktivierten Kanäle bezahlen. Der Betrag wird um die Zustellungskosten aktualisiert : 2 € für digitale Benachrichtigungen, höher für das Papier-Einschreiben, das nur bei Fehlen digitaler Kanäle versendet wird oder wenn Sie die Mitteilung nicht rechtzeitig öffnen | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica : 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Dieses Dokument ist eine rechtsgültige Mitteilung, die dich dazu auffordert, die dir zugestellten Dokumente zur Kenntnis zu nehmen. Diese entfalten in jedem Fall Rechtswirkungen für dich. Ist eine Zahlung vorgesehen, hängt der zu zahlende Betrag von der Zugangsart ab, die du für die Zustellung wählst, der Art des dir möglicherweise zugesandten und von der Körperschaft gewählten Einschreibens sowie der Anzahl der Zustellversuche. Du hast 120 Tage ab dem Datum, an dem die Zustellung Rechtsgültigkeit erlangt, um auf die Dokumente online zuzugreifen. Nach Ablauf dieser 120 Tage sind die Dokumente nicht mehr verfügbar, und du musst dich an die Körperschaft wenden, die sie dir zugesandt hat. Erfahre mehr darüber, wie du die Fristen berechnest unter string"
      fr: "AVIS DE RÉCEPTION | AVVISO DI AVVENUTA RICEZIONE string Code IUN: Identificativo Univoco Notifica: string Code Fiscal | Codice fiscale: string Envoyé par Inviata tramite notifichedigitali.it Vous avez reçu une communication à valeur légale de | Hai ricevuto una comunicazione a valore legale da string avec pour objet | con oggetto: string Consultez la copie des documents joints ou accédez aux documents originaux en ligne en suivant les instructions. Veuillez noter que le contenu de la communication produira des effets juridiques à votre égard, même sans que vous ayez consulté les documents. Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCÉDER AUX DOCUMENTS EN LIGNE GRATUIT | ACCEDI AI DOCUMENTI ONLINE GRATIS Scannez le avec l'appareil photo de votre appareil ou rendez-vous sur le site web code QR | Inquadra il con la fotocamera del tuo dispositivo oppure vai sul sito web string codice QR string Accédez et téléchargez les documents : ils contiennent des informations importantes vous concernant | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Si un paiement est dû, vous pouvez payer en ligne ou via les canaux habilités pagoPA. Le montant sera mis à jour avec les frais de notification : 2 € pour les notifications numériques, plus élevés pour la lettre recommandée papier, envoyée uniquement en l'absence de canaux numériques ou si vous n'ouvrez pas la communication à temps | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica : 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Ce document est une communication à valeur légale qui vous invite à prendre connaissance des documents qui vous ont été notifiés et qui produiront des conséquences à votre égard dans tous les cas. Si un paiement est prévu, le montant à payer dépendra du mode que vous choisissez pour accéder à la notification, du type d'éventuelle lettre recommandée qui vous a été envoyée et choisie par l'organisme, et du nombre de tentatives de remise. Vous disposez de 120 jours à compter de la date à laquelle la notification prend effet légal pour accéder aux documents en ligne. Passé ce délai de 120 jours, les documents ne seront plus disponibles et vous devrez vous adresser à l'organisme qui vous les a envoyés. Pour en savoir plus sur le calcul des délais, consultez string"
      sl: "OBVESTILO O PREJEMU | AVVISO DI AVVENUTA RICEZIONE string Edinstvena identifikacijska oznaka obvestila: Identificativo Univoco Notifica: string Davčno Številko | Codice fiscale: string Poslano od Inviata tramite notifichedigitali.it Prejeli ste uradno sporočilo od | Hai ricevuto una comunicazione a valore legale da string z zadevo | con oggetto: string Preglejte kopijo priloženih dokumentov ali dostopajte do izvirnih dokumentov na spletu po navodilih. Upoštevajte, da bo vsebina sporočila imela pravne učinke za vas, tudi če si dokumentov ne boste ogledali. Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. DOSTOP DO DOKUMENTOV NA SPLETU BREZPLAČNO | ACCEDI AI DOCUMENTI ONLINE GRATIS Optično preberite s kamero vaše naprave ali pojdite na spletno stran | kodo QR string Inquadra il con la fotocamera del tuo dispositivo oppure vai sul sito web codice QR string Dostopajte do dokumentov in jih prenesite: vsebujejo pomembne informacije, ki se nanašajo na vas | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Če je predvideno plačilo, lahko plačate na spletu ali prek kanalov, ki omogočajo pagoPA. Znesek se bo posodobil s stroški vročitve : 2 € za digitalna obvestila, višji za priporočeno pismo v papirni obliki, poslano le v primeru odsotnosti digitalnih kanalov ali če sporočila ne odprete pravočasno | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica : 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Ta dokument je uradno sporočilo, ki vas vabi k pregledu dokumentov, ki so vam bili vročeni in ki bodo v vsakem primeru imeli pravne posledice za vas. Če je predvideno plačilo, bo znesek plačila odvisen od načina, ki ga izberete za dostop do obvestila, od vrste morebitnega priporočenega pisma, ki vam ga pošlje in izbere organ, in od števila poskusov vročitve. Imate 120 dni od datuma, ko obvestilo postane pravno veljavno, za dostop do dokumentov na spletu. Po preteku 120 dni dokumenti ne bodo več na voljo in se boste morali obrniti na organ, ki vam jih je poslal. Izvedite več o tem, kako izračunati roke na string"

