  aar-no-radd:
    pf:
      it: "AVVISO DI AVVENUTA RICEZIONE Inviata tramite string Hai ricevuto una comunicazione a valore legale da string con oggetto: string Accedi subito ai documenti online seguendo le istruzioni o, se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. OPZIONE 1: ACCEDI ORA AI DOCUMENTI ONLINE Consultazione online gratuita Inquadra il con la fotocamera del tuo dispositivo oppure vai sul sito web codice QR string Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Se previsto un pagamento, puoi pagare con tutti i canali abilitati a pagoPA L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo OPZIONE 2: RITIRA I DOCUMENTI DI PERSONA Servizio di stampa a pagamento Puoi farlo tu o delegare una persona di fiducia. Segui le istruzioni sul retro del foglio. Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su string OPZIONE 2: RITIRA I DOCUMENTI DI PERSONA Servizio di stampa a pagamento Cerca il Punto di ritiro SEND più vicino a te su oppure chiama il string/punti-di-ritiro numero string Recati al punto di ritiro portando con te: questo avviso un tuo documento di riconoscimento il tuo codice fiscale un documento che attesti il tuo ruolo di legale rappresentante Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro Identificativo Univoco Notifica: string Codice fiscale - Persona giuridica: string Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Vuoi che qualcuno ritiri i documenti per te? Io, Nome e Cognome in qualità di legale rappresentante di string string, delego Nome e Cognome Codice Fiscale a ritirare i documenti notificati. Firma La persona delegata dovrà portare con sé: questo avviso con la delega compilata e firmata un suo documento di riconoscimento il suo codice fiscale una copia o l'originale del codice fiscale e di un documento di riconoscimento del delegante un documento che attesti il ruolo di legale rappresentante del delegante COME SFRUTTARE TUTTI I VANTAGGI DI SEND - SERVIZIO NOTIFICHE DIGITALI? SEND è il servizio che semplifica l'invio delle comunicazioni a valore legale della Pubblica Amministrazione. Grazie a SEND puoi consultare le notifiche in digitale ed evitare le raccomandate e i relativi costi. Ti avvisiamo sui tuoi canali preferiti Aggiungi i tuoi recapiti per ricevere un avviso quando c'è una notifica per te Consulta i documenti online Accedi ai documenti online comodamente dal tuo dispositivo Eviti i costi di raccomandata Se accedi in tempo, eviti l'invio della raccomandata e i relativi costi Configura SEND accedendo alla tua area personale su: string"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Gesendet von Inviata tramite string Du hast eine rechtsgültige Mitteilung von | Hai ricevuto una comunicazione a valore legale da string mit dem Betreff | con oggetto: string erhalten Greife sofort online auf die Dokumente zu, indem du den Anweisungen folgst, oder hole die Dokumente in Papierform bei einer der SEND Abholstellen ab. Beachte, dass der Inhalt der Mitteilung Rechtswirkungen entfaltet, auch ohne Einsicht der Dokumente. GREIFE ONLINE AUF DIE DOKUMENTE ZU KOSTENLOS | ACCEDI AI DOCUMENTI ONLINE GRATIS Scanne den QR-Code oder gehe zur Website string Greife auf die Dokumente zu und lade sie herunter: sie enthalten wichtige Informationen für dich Ist eine Zahlung vorgesehen, kannst du über pagoPA bezahlen. Der Betrag wird mit den Zustellungskosten aktualisiert: 2 € für digitale Zustellungen, höher für Papier-Einschreiben Dieses Dokument ist eine rechtsgültige Mitteilung mit rechtlichen Folgen. Du hast 120 Tage Zeit, online auf die Dokumente zuzugreifen oder sie persönlich abzuholen. Danach sind sie nicht mehr verfügbar. Erfahre mehr über Fristen auf string"
