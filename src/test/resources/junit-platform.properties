# INIPEC gestione esito puntuale: gli scenari @inipecParallel girano in parallelo tra loro (lock condiviso),
# mentre @inipecIsolato gira da solo, senza sovrapporsi ai precedenti (lock esclusivo sulla stessa risorsa).
cucumber.execution.exclusive-resources.inipecParallel.read=it.pagopa.pn.client.b2b.pa.resources.InipecGestionePuntualeResources
cucumber.execution.exclusive-resources.inipecIsolato.read-write=it.pagopa.pn.client.b2b.pa.resources.InipecGestionePuntualeResources

