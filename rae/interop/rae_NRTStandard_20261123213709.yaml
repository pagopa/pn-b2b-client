    error_log: |
      java.lang.AssertionError: [Verifica che gli enti verificatori attesi siano quelli effettivamente restituiti] 
      Expecting:
        [0e9e2dab-2e93-4f24-ba59-38d9f11198ca, 69e2865e-65ab-4e48-a638-2037a9ee2ee7]
      to contain exactly in any order:
        [0e9e2dab-2e93-4f24-ba59-38d9f11198ca]
      but the following elements were unexpected:
        [69e2865e-65ab-4e48-a638-2037a9ee2ee7]
      
      	at it.pagopa.pn.interop.cucumber.steps.m2m.attribute.VerifiedAttributeSteps.verificaVerifiers(VerifiedAttributeSteps.java:136)
      	at ✽.la lista degli enti che hanno verificato l'attributo è(classpath:it/pagopa/pn/cucumber/m2mgateway/attributes.feature:209)
    procedure: |
      Nei log dell'esecuzione, confronta le GET dei verificatori
      prima e dopo la revoca. Esamina la DELETE BFF intermedia:
      controlla l'URL privo di query, il body con agreementId e la
      risposta HTTP 400 che segnala query.agreementId come obbligatorio.

      Verifica nello step di revoca e in HttpCallExecutor come viene
      gestito l'errore HTTP, per capire perché il test prosegue fino
      all'assertion. Confronta infine la richiesta con la specifica
      BFF presente nel repository, che colloca agreementId nel body.

    result: |
      Dopo la revoca, lo scenario si aspettava che l'ente revocatore
      non comparisse più nella lista dei verificatori. La GET ha invece
      restituito entrambi gli enti iniziali, causando il fallimento
      dell'assertion; la verifica dei revocatori non è stata raggiunta.

      La revoca non è stata applicata perché la richiesta DELETE
      inviata dalla suite conteneva agreementId nel body, mentre il
      BFF QA ha risposto HTTP 400 indicando come obbligatorio il
      parametro query.agreementId. Lo step ha registrato l'errore
      senza interrompere il test, che è proseguito fino alla verifica
      della lista.

      È stato quindi rilevato un disallineamento tra la richiesta
      della suite e il comportamento del BFF QA. Poiché la specifica
      BFF consultata nel repository prevede agreementId nel body,
      il contratto distribuito va verificato prima di allineare il
      client generato.
    link_prod_bug: ''
    link_suite_bug: https://pagopa.atlassian.net/browse/QA-19747
