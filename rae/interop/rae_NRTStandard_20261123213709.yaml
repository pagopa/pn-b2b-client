  - id_test: '[M2M_REVERSE_PURPOSE_PATCH_5] Un utente con ruolo M2M-ADMIN NON può effettuare una modifica parziale
    di una finalità associata ad un e-service ad erogazione inversa in stato diverso da DRAFT [Examples: (senza
    nome) | Example #1 | line: 1003] [cucumber-report-m2mv3.json]'
    error_log: |
