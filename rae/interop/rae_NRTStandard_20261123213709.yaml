  - id_test: '[INTEROP-EST-M2M-DELETE_05_A] Un utente con ruolo M2M-ADMIN NON può effettuare la cancellazione di un
    e-service template in stato DRAFT che non gli appartiene [cucumber-report-m2mv3.json]'
    error_log: |
      org.opentest4j.AssertionFailedError: expected: <404> but was: <403>
      	at it.pagopa.pn.interop.cucumber.steps.delegate.DelegationCommonStep.thenStatusCodeIs(DelegationCommonStep.java:176)
      	at ✽.si ottiene lo status code 404(classpath:it/pagopa/pn/cucumber/m2mgateway/e-service-templates.feature:518)
    procedure: |
      Esamina lo scenario e individua lo stato dell'e-service template,
      l'ente creatore e il ruolo dell'utente che tenta la cancellazione.
      Confronta lo status atteso con quello riportato nell'assertion.

      Nei log NRT, individua la DELETE M2M dell'e-service template e
      controlla lo status e il body della risposta.

    result: |
      Un utente M2M-ADMIN di un ente diverso dal creatore tenta di
      eliminare un e-service template in stato DRAFT. Lo scenario si
      aspetta HTTP 404, perché il template non pubblicato non dovrebbe
      essere visibile all'ente chiamante.

      La DELETE restituisce invece HTTP 403 Forbidden, con codice
      011-9989 e dettaglio "Insufficient privileges". Il confronto
      dello status fallisce e la successiva verifica dell'esistenza
      del template da parte dell'ente creatore non viene eseguita.

    link_prod_bug: https://pagopa.atlassian.net/browse/PIN-8052
    link_suite_bug: ''
