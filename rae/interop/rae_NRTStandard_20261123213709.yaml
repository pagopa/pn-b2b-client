  - id_test: '[AGREEMENT_DOC_ARCHIVE_1] Attivazione richiesta di fruizione - archiviazione PDF firmato [cucumber-report-nrt-bff-m2mv2.json]'
    error_log: |
      java.lang.AssertionError: [Atteso file AGREEMENT_CONTRACT_DOC dopo l'evento AGREEMENT_ACTIVATED nel bucket WORM ma non è stato trovato] 
      Expecting actual not to be null
      	at it.pagopa.pn.interop.cucumber.steps.archiviazione_documentale.ArchivingSteps.checkFileInS3Bucket(ArchivingSteps.java:80)
      	at ✽.verifica che a fronte dell'evento AgreementActivated venga generato nell'opportuno bucket S3 WORM un AGREEMENT_CONTRACT_DOC(classpath:it/pagopa/pn/cucumber/archiviazione-documentale/archiviazione-documentale.feature:26)
    procedure: |
      Inoltra una richiesta di fruizione per un e-service con approvazione
      automatica e verifica che raggiunga lo stato ACTIVE. Cerca il documento
      AGREEMENT_CONTRACT_DOC nei bucket STANDARD e WORM, verificandone il
      contenuto e la retention prevista per il bucket WORM. Controlla se la
      finestra temporale applicata alla ricerca viene ampliata ai tentativi
      successivi.

    result: |
      La richiesta raggiunge lo stato ACTIVE e il documento viene trovato
      nel bucket STANDARD. La ricerca nel bucket WORM termina senza trovare
      un documento corrispondente; le verifiche successive sulla retention,
      sul contenuto WORM e sugli eventi non vengono eseguite.

      Il codice della suite incrementa la finestra riportata nel log, ma
      continua a filtrare gli oggetti usando gli estremi iniziali. Non è
      dimostrato che questo difetto abbia causato il mancato ritrovamento
      del documento nella specifica esecuzione.
    link_prod_bug: ''
    link_suite_bug: https://pagopa.atlassian.net/browse/QA-19753
