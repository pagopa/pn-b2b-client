      	at it.pagopa.pn.interop.cucumber.steps.delegate.DelegationCommonStep.thenStatusCodeIs(DelegationCommonStep.java:176)
      	at ✽.si ottiene lo status code 400(classpath:it/pagopa/pn/cucumber/m2mgateway/purposes.feature:999)
    procedure: |
      Esamina lo scenario e individua gli stati diversi da DRAFT
      previsti per la versione della finalità. Confronta lo status
      atteso con quello riportato nei report NRT M2M V2 e V3.

      Analizza nei log le richieste PATCH all'endpoint reversePurposes
      e le relative risposte. Verifica, tramite le GET precedenti, lo
      stato delle versioni e controlla se il test esegue la successiva
      verifica di invarianza della finalità.

    result: |
      Lo scenario prevede che la modifica parziale di una finalità
      associata a un e-service in modalità RECEIVE sia rifiutata con
      HTTP 400 quando la versione non è in stato DRAFT.

