      invece con HTTP 409, codice 004-0015 e messaggio
      "Purpose not in draft state". La richiesta viene quindi
      rifiutata, ma con uno status diverso da quello atteso.

      Il test si interrompe sul confronto dello status HTTP; la
      successiva verifica che la finalità non abbia subito modifiche
      non viene eseguita.
