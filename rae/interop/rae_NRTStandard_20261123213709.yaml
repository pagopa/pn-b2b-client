    error_log: |
      it.pagopa.interop.authorization.service.utils.PollingPredicateException: Eventual consistency error: Failed to publish descriptor
      	at it.pagopa.interop.authorization.service.utils.PollingService.makePolling(PollingService.java:42)
      	at it.pagopa.interop.authorization.service.utils.PollingService.makePolling(PollingService.java:17)
      	at it.pagopa.pn.interop.cucumber.steps.catalog.DescriptorPublicationSteps.publishDescriptor(DescriptorPublicationSteps.java:202)
      	at it.pagopa.pn.interop.cucumber.steps.delegate.DelegationCommonStep.buildWFAEService(DelegationCommonStep.java:157)
      	at it.pagopa.pn.interop.cucumber.steps.delegate.DelegationCommonStep.createWFAEService(DelegationCommonStep.java:95)
      	at ✽."PA1" ha già creato un e-service con un descrittore in stato WAITING_FOR_APPROVAL usando "PA2" come delegato(classpath:it/pagopa/pn/cucumber/m2mgateway/eservices.feature:289)
    procedure: |
      Verifica nei log NRT l'abilitazione di PA2 a ricevere deleghe in
      erogazione, la risposta alla creazione della delega e i successivi
      tentativi di pubblicazione del descriptor. Confronta l'esito con il
      rerun locale e cerca nei log completi eventuali modifiche concorrenti
      della disponibilità di PA2.

    result: |
      Il rerun locale si conclude con successo. In NRT la richiesta di
      abilitazione di PA2 a ricevere deleghe in erogazione risponde 204, ma
      la successiva creazione della delega fallisce con HTTP 403, codice
      010-0007 "Tenant not allowed to delegation".

      La preparazione prosegue comunque e tenta di pubblicare il descriptor
      come delegato, ricevendo ripetutamente HTTP 403 "Insufficient
      privileges". Il polling si esaurisce con il messaggio generico
      "Failed to publish descriptor"; la riattivazione M2M oggetto dello
      scenario non viene raggiunta.

      Una modifica concorrente della disponibilità di PA2 è una possibile
      causa del primo 403, ma i log filtrati non la dimostrano.
