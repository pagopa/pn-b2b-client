- id_test: '[M2M_ES_TEMPLATES_CERTIFIED_ATTRIBUTES_ADD_05] Un utente NON può aggiungere degli attributi certificati
    a una versione di un e-service template indicando un auth. token non valido (Parte2#Scenario intorno a 120)
    [Examples: (senza nome) | Example #1 | line: 130] [cucumber-report-m2mv3.json]'
  error_log: |
    java.lang.AssertionError: La risk analysis non è stata aggiunta correttamente all'e-service template
    	at it.pagopa.pn.interop.cucumber.steps.e_service_template.shared.EServiceTemplateTestAssistant.checkRiskAnalysisAddedToEServiceTemplate(EServiceTemplateTestAssistant.java:500)
    	at it.pagopa.pn.interop.cucumber.steps.e_service_template.shared.EServiceTemplateTestAssistant.addRiskAnalysisToEServiceTemplateSuccessfully(EServiceTemplateTestAssistant.java:416)
    	at it.pagopa.pn.interop.cucumber.steps.e_service_template.crud.EServiceTemplateCreateSteps.createEServiceTemplate(EServiceTemplateCreateSteps.java:96)
    	at ✽.l'utente effettua la creazione di un e-service template in modalità ricezione in stato di DRAFT(classpath:it/pagopa/pn/cucumber/m2mgateway/e-service-templates-certified-attributes.feature:112)
  procedure: |
    Analizzare lo stack trace dell'esecuzione NRT e individuare
    il punto di fallimento nel setup dello scenario: la creazione
    del template DRAFT viene interrotta durante la verifica della 
    risk analysis aggiunta correttamente.
    Rieseguire isolatamente lo scenario per entrambe le modalità 
    previste e verificare che la creazione del template, l'aggiunta 
    della risk analysis e la successiva gestione degli attributi 
    completino correttamente.
  result: |
    Il fallimento è avvenuto durante il setup dello scenario, prima
    della fase che verifica la risposta HTTP 401 attesa. 
    La creazione del template è stata considerata fallita dal polling 
    che non ha riscontrato la risk analysis entro la finestra prevista.
    La riesecuzione isolata in locale non ha prodotto errori, quindi
    il comportamento è coerente con una propagazione intermittente
    delle informazioni del template o con un carico elevato delle
    richieste durante l'esecuzione NRT.
  link_prod_bug: ''
  link_suite_bug: ''
- id_test: '[INTEROP-EST-M2M-PATCH_05] Un utente con ruolo M2M-ADMIN NON può effettuare una modifica parziale di
    un e-service template in stato diverso da DRAFT (Parte2#Scenario intorno a 150) [Examples: (senza nome) | Example
    #1 | line: 208] [cucumber-report-m2mv3.json]'
  error_log: |
    org.opentest4j.AssertionFailedError: expected: <400> but was: <409>
    	at it.pagopa.pn.interop.cucumber.steps.delegate.DelegationCommonStep.thenStatusCodeIs(DelegationCommonStep.java:176)
    	at ✽.si ottiene lo status code 400(classpath:it/pagopa/pn/cucumber/m2mgateway/e-service-templates.feature:204)
  procedure: |
    Confronta lo status atteso nello scenario con l'errore riportato
    nel report NRT. Nei log della richiesta PATCH all'e-service
    template, verifica lo status HTTP e il dettaglio della risposta.
    Controlla infine quali verifiche successive sono state eseguite.
  result: |
    La modifica parziale di un e-service template non in stato
    DRAFT viene rifiutata con HTTP 409 Conflict e codice 011-0010,
    mentre lo scenario si aspetta HTTP 400 Bad Request. La risposta
    indica che l'e-service template non è in stato DRAFT.

    Il test si interrompe sul confronto dello status HTTP; la
    successiva verifica che il template non abbia subito modifiche
    non viene eseguita. Il fallimento è stato osservato anche
    nell'esecuzione locale riferita.
