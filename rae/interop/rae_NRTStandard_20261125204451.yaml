  procedure: |
    Crea un template e-service in ricezione come GSP e inserisci
    un'analisi del rischio con dati particolari e giudiziari,
    omettendo le misure tecniche e organizzative. Controlla la
    risposta all'inserimento e il successivo tentativo di pubblicazione.
  result: |
    La POST dell'analisi del rischio risponde HTTP 204 nonostante
    l'assenza delle misure tecniche: comportamento coerente con il
    bug prodotto descritto, il cui esempio utilizza tenantKind PRIVATE
    mentre questo scenario utilizza GSP.

    Il test prosegue e la pubblicazione risponde HTTP 404, codice
    011-0018, per mancanza del documento di interfaccia. L'assertion
    confronta questo 404 con il 400 atteso, non la risposta della
    POST dell'analisi del rischio. La causa della mancanza
    dell'interfaccia non è chiarita dai log.
  link_prod_bug: https://pagopa.atlassian.net/browse/PIN-10963
