- id_test: '[M2M_PURPOSE_TEMPLATE_EVENTS_04] L''evento di generazione del template della Risk Analysis di un purpose
    template deve essere visibile a tutti [cucumber-report-m2mv3.json]'
  error_log: |
    it.pagopa.interop.authorization.service.utils.PollingPredicateException: Eventual consistency error: L'evento RISK_ANALYSIS_TEMPLATE_DOCUMENT_GENERATED doveva essere visibile
    	at it.pagopa.interop.authorization.service.utils.PollingService.makePolling(PollingService.java:68)
    	at it.pagopa.pn.interop.cucumber.steps.m2m.event.M2MEventsSteps.checkEventPresence(M2MEventsSteps.java:70)
    	at ✽."PA1" visualizza l'evento RiskAnalysisTemplateDocumentGenerated con:(classpath:it/pagopa/pn/cucumber/m2mgateway/apiv3/purpose-template-events.feature:47)
  procedure: |
    Analizzare lo stack trace dell'esecuzione NRT e individuare
    il punto di fallimento in M2MEventsSteps.checkEventPresence.
    Verificare che il KO si verifichi durante il controllo della
    visibilità dell'evento RISK_ANALYSIS_TEMPLATE_DOCUMENT_GENERATED
    per PA1, a seguito della pubblicazione del purpose template.

    Rieseguire lo scenario isolatamente in locale e verificare
    che il controllo dell'evento venga completato correttamente.
    Esaminare la configurazione del polling in M2MEventsSteps,
    confrontando il numero di tentativi e l'intervallo tra
    le verifiche con i tempi necessari alla propagazione
    degli eventi nel sistema.

    Valutare l'estensione della finestra di polling per gestire
    eventuali ritardi di visibilità durante le esecuzioni NRT.
  result: |
    Durante l'esecuzione NRT, il test non ha rilevato l'evento
    RISK_ANALYSIS_TEMPLATE_DOCUMENT_GENERATED per PA1 entro
    la finestra di polling configurata, terminando con una
    PollingPredicateException.

    La riesecuzione isolata in locale si è conclusa con successo,
    indicando un comportamento intermittente. Il fallimento è
    compatibile con un ritardo nella propagazione dell'evento,
    potenzialmente accentuato dal carico generato dalle esecuzioni
    NRT, ma questa correlazione non è stata ancora dimostrata.

    È stata individuata una possibile insufficienza della finestra
    temporale di polling della suite. Il ticket QA-19746 prevede
    di configurare 25 tentativi con intervalli di 5 secondi,
    portando l'attesa nominale massima da 57,5 a 120 secondi,
    escluso il tempo delle chiamate HTTP.
