- id_test: '[RA_GDPR_ART_9_10_COMPILE_7] Richiesta non soddisfatta misure tecniche compilando analisi rischio con
    dati particolari e giudiziari durante pubblicazione template e-service in ricezione [Examples: (senza nome)
    | Example #1 | line: 414] [cucumber-report-adeg-analisi-rischio.json]'
  error_log: |
    org.opentest4j.AssertionFailedError: The request code is not 400 Bad Request as expected ==> expected: <400> but was: <404>
    	at org.junit.jupiter.api.AssertionFailureBuilder.build(AssertionFailureBuilder.java:151)
