name: Dev Activity Report

on:
  schedule:
    - cron: "0 18 * * *"  # ogni giorno alle 18:00 UTC
  workflow_dispatch:     # permette run manuale
    inputs:
        report_date:
          description: "Date to analyze (YYYY-MM-DD). Leave empty for today UTC."
          required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remotes
        run: git fetch --all --prune

      - name: Generate Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            TODAY="${{ github.event.inputs.report_date }}"
          else
            TODAY=$(date -u +%Y-%m-%d)
          fi

          echo "Using date: $TODAY"
          
          PAYLOAD_TEXT="*Dev Activity Report - $TODAY*"
          PAYLOAD_TEXT+=$'\n\n'

          # Lista branch remoti
          BRANCHES=($(git for-each-ref --format='%(refname:short)' refs/remotes/origin/))

          # Mappa autori Git → login GitHub + bot detection
          declare -A AUTHOR_MAP

          for BR in "${BRANCHES[@]}"; do
            SHAS=($(git log "$BR" --since="$TODAY 00:00" --until="$TODAY 23:59" --pretty="%H"))

            for SHA in "${SHAS[@]}"; do
              LOGIN=$(gh api repos/${{ github.repository }}/commits/$SHA --jq '.author.login' 2>/dev/null)
              NAME=$(git log -1 --format="%an" $SHA)

              # fallback al nome Git se non c'è login
              if [ -z "$LOGIN" ] || [ "$LOGIN" == "null" ]; then
                LOGIN="$NAME"
              fi

              # Bot detection
              IS_BOT=$(gh api repos/${{ github.repository }}/commits/$SHA --jq '.author.type' 2>/dev/null)
              if [[ "$IS_BOT" == "Bot" ]]; then
                LOGIN="${LOGIN}[bot]"
              fi

              AUTHOR_MAP["$LOGIN"]=1
            done
          done

          # Array finale dei contributor
          CONTRIBUTORS=("${!AUTHOR_MAP[@]}")

          echo "Contributors found:"
          printf '%s\n' "${CONTRIBUTORS[@]}"

          if [ ${#CONTRIBUTORS[@]} -eq 0 ]; then
            PAYLOAD_TEXT+="⚠️ No contributors detected today."
            PAYLOAD_TEXT+=$'\n'
          else
            echo "$CONTRIBUTORS" | while IFS= read -r DEV; do
            for DEV in "${CONTRIBUTORS[@]}"; do
              echo "Processing $DEV"
            
              # Recupero SHA dei commit del giorno dell'utente
              DEV_SHAS=()
              for BR in "${BRANCHES[@]}"; do
                BR_SHAS=($(git log "$BR" --since="$TODAY 00:00" --until="$TODAY 23:59" --author="$DEV" --pretty="%H"))
                DEV_SHAS+=("${BR_SHAS[@]}")
              done

              # Conteggio commit
              COMMITS=${#DEV_SHAS[@]}

              # Lines changed
              SIZE=0
              for SHA in "${DEV_SHAS[@]}"; do
                CHG=$(git show --shortstat "$SHA" 2>/dev/null | grep "files changed" | awk '{sum+=$4} END {print sum+0}')
                SIZE=$((SIZE + CHG))
              done

              # Push detection semantica
              PUSH=$COMMITS

              # PR aperte
              PR=$(gh pr list --author "$DEV" --state open --json number | jq length)
            
              if [ "$COMMITS" -eq 0 ]; then
                STATUS="❌ No commit"
              elif [ "$COMMITS" -gt 15 ]; then
                STATUS="⚠️ Possibly non-atomic commits"
              elif [ "$PUSH" -eq 0 ]; then
                STATUS="⚠️ No push"
              else
                STATUS="✅ OK"
              fi
            
              PAYLOAD_TEXT+="👨‍💻 $DEV"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Commits: $COMMITS"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Lines changed: $SIZE"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Push: $PUSH"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Open PR: $PR"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Status: $STATUS"
              PAYLOAD_TEXT+=$'\n\n'
              
            done
          fi

          # Creo JSON sicuro per Slack usando jq
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "$PAYLOAD_TEXT" \
            '{channel:$channel, text:$text, mrkdwn:true}' \
            > dev_payload.json

      - name: Debug payload
        run: |
          echo "=== DEV PAYLOAD ==="
          cat dev_payload.json

      - name: Send Slack message
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: dev_payload.json
