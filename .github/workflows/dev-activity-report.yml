name: Dev Activity Report

on:
  schedule:
    - cron: "0 18 * * *"  # ogni giorno alle 18:00 UTC
  workflow_dispatch:     # permette run manuale

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remotes
        run: git fetch --all --prune

      - name: Generate Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PAYLOAD_TEXT="*Dev Activity Report - $TODAY*\n\n"

          CONTRIBUTORS=$(git log origin/develop --since="$TODAY 00:00" --until="$TODAY 23:59" --all --pretty="%an" | sort | uniq)

          echo "Contributors found:"
          echo "$CONTRIBUTORS"

          if [ -z "$CONTRIBUTORS" ]; then
            PAYLOAD_TEXT+="⚠️ No contributors detected today.\n"
          else
            for DEV in $CONTRIBUTORS; do

              COMMITS=$(git log origin/develop --since="$TODAY 00:00" --until="$TODAY 23:59" --all --author="$DEV" --pretty=oneline | wc -l)

              SIZE=$(git log --since="$TODAY 00:00" --until="$TODAY 23:59" --all --author="$DEV" --shortstat \
                | grep "files changed" \
                | awk '{sum+=$4} END {print sum+0}')

              PUSH=$(gh api repos/${{ github.repository }}/events \
                --jq '[.[] | select(.type=="PushEvent" and .actor.login=="'"$DEV"'")] | length')

              PR=$(gh pr list --author "$DEV" --state open --json number | jq length)

              if [ "$COMMITS" -eq 0 ]; then
                STATUS="❌ No commit"
              elif [ "$COMMITS" -gt 15 ]; then
                STATUS="⚠️ Possibly non-atomic commits"
              elif [ "$PUSH" -eq 0 ]; then
                STATUS="⚠️ No push"
              else
                STATUS="✅ OK"
              fi

              PAYLOAD_TEXT+="👨‍💻 $DEV\n"
              PAYLOAD_TEXT+="Commits: $COMMITS\n"
              PAYLOAD_TEXT+="Lines changed: $SIZE\n"
              PAYLOAD_TEXT+="Push: $PUSH\n"
              PAYLOAD_TEXT+="Open PR: $PR\n"
              PAYLOAD_TEXT+="Status: $STATUS\n\n"
            done
          fi

          # Creo JSON sicuro per Slack usando jq
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "$PAYLOAD_TEXT" \
            '{channel:$channel, text:$text, mrkdwn:true}' \
            > dev_payload.json

      - name: Debug payload
        run: |
          echo "=== DEV PAYLOAD ==="
          cat dev_payload.json

      - name: Send Slack message
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: dev_payload.json
