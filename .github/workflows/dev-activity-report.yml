name: Dev Activity Report

on:
  schedule:
    - cron: "0 18 * * *"  # ogni giorno alle 18:00 UTC
  workflow_dispatch:     # permette run manuale
    inputs:
        report_date:
          description: "Date to analyze (YYYY-MM-DD). Leave empty for today UTC."
          required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remotes
        run: git fetch --all --prune

      - name: Generate Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            TODAY="${{ github.event.inputs.report_date }}"
          else
            TODAY=$(date -u +%Y-%m-%d)
          fi

          echo "Using date: $TODAY"
          
          PAYLOAD_TEXT="*Dev Activity Report - $TODAY*"
          PAYLOAD_TEXT+=$'\n\n'

          echo "Mapping git authors → github logins..."
          CONTRIBUTORS=$(
          git log --remotes=origin \
            --since="$TODAY 00:00" \
            --until="$TODAY 23:59" \
            --all \
            --pretty="%H" |
          while read SHA; do
            gh api repos/${{ github.repository }}/commits/$SHA \
              --jq '.author.login' 2>/dev/null
          done | sort | uniq
          )

          echo "Contributors found:"
          echo "$CONTRIBUTORS"

          if [ -z "$CONTRIBUTORS" ]; then
            PAYLOAD_TEXT+="⚠️ No contributors detected today."
            PAYLOAD_TEXT+=$'\n'
          else
            for DEV in $CONTRIBUTORS; do

              echo "Processing $DEV"
            
              # Recupero SHA dei commit dell'utente (già mappati via API)
              DEV_SHAS=$(
                git log --remotes=origin \
                  --since="$TODAY 00:00" \
                  --until="$TODAY 23:59" \
                  --all \
                  --pretty="%H" |
                while read SHA; do
                  LOGIN=$(gh api repos/${{ github.repository }}/commits/$SHA \
                    --jq '.author.login' 2>/dev/null)
                  if [ "$LOGIN" = "$DEV" ]; then
                    echo "$SHA"
                  fi
                done
              )
            
              # Commit count reale
              COMMITS=$(echo "$DEV_SHAS" | grep -c .)
            
              # Lines changed reali
              SIZE=$(echo "$DEV_SHAS" |
                while read SHA; do
                  git show --shortstat $SHA
                done |
                grep "files changed" |
                awk '{sum+=$4} END {print sum+0}')
            
              # Push detection semantica stabile
              PUSH=$COMMITS
            
              # PR aperte
              PR=$(gh pr list --author "$DEV" --state open --json number | jq length)
            
              if [ "$COMMITS" -eq 0 ]; then
                STATUS="❌ No commit"
              elif [ "$COMMITS" -gt 15 ]; then
                STATUS="⚠️ Possibly non-atomic commits"
              elif [ "$PUSH" -eq 0 ]; then
                STATUS="⚠️ No push"
              else
                STATUS="✅ OK"
              fi
            
              PAYLOAD_TEXT+="👨‍💻 $DEV"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Commits: $COMMITS"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Lines changed: $SIZE"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Push: $PUSH"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Open PR: $PR"
              PAYLOAD_TEXT+=$'\n'
              PAYLOAD_TEXT+="Status: $STATUS"
              PAYLOAD_TEXT+=$'\n\n'
              
            done
          fi

          # Creo JSON sicuro per Slack usando jq
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "$PAYLOAD_TEXT" \
            '{channel:$channel, text:$text, mrkdwn:true}' \
            > dev_payload.json

      - name: Debug payload
        run: |
          echo "=== DEV PAYLOAD ==="
          cat dev_payload.json

      - name: Send Slack message
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: dev_payload.json
