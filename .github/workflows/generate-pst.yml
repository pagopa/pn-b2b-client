name: Generate PST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-pst-develop
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/generators/pst
    steps:
      - name: Checkout develop snapshot and all branch histories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout qe_suit scenario histories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pagopa/qe_suit
          path: source-repos/qe_suit
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/generators/pst/requirements.txt

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify generator
        run: python -m unittest discover -s tests -v

      - name: Generate PSTs for active releases
        id: generate
        env:
          PST_OUTPUT_DIR: ${{ runner.temp }}/pst-generated
        run: >-
          python -m pst_generator.cli generate-all
          --repo "$GITHUB_WORKSPACE"
          --config config.yaml
          --output-dir "$PST_OUTPUT_DIR"
          --html

      - name: Upload generated PSTs, including partial successes
        if: ${{ !cancelled() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pst-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pst-generated/
          if-no-files-found: warn
          retention-days: 30
