name: Build on PR

on:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for open PR
        id: pr_check
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            // Cerca una PR con head branch uguale a quello del push
            const pr = prs.data.find(pr => pr.head.ref === branch);
            if (!pr) {
              core.setOutput('has_pr', 'false');
              core.setOutput('pr_number', '');
            } else {
              core.setOutput('has_pr', 'true');
              core.setOutput('pr_number', String(pr.number));
            }

      - name: Get changed modules in PR
        id: changed_modules
        if: steps.pr_check.outputs.has_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            if (!prNumber) return '';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber),
              per_page: 100
            });
            const fs = require('fs');
            const modules = new Set();
            for (const file of files) {
              const parts = file.filename.split('/');
              if (parts.length > 1) {
                const moduleDir = parts[0];
                if (fs.existsSync(`${moduleDir}/pom.xml`)) {
                  modules.add(moduleDir);
                }
              }
            }
            return Array.from(modules).join(' ');
          env:
            PR_NUMBER: ${{ steps.pr_check.outputs.pr_number }}

      - name: Set up Java and Maven
        if: steps.pr_check.outputs.has_pr == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build all changed modules
        if: steps.pr_check.outputs.has_pr == 'true' && steps.changed_modules.outputs.result != ''
        run: |
          for module in ${{ steps.changed_modules.outputs.result }}; do
            echo "Building $module"
            (cd $module && mvn clean install -DskipTests -Dgithub.token=${{ secrets.GH_TOKEN }})
          done

      - name: Build root project
        if: steps.pr_check.outputs.has_pr == 'true' && steps.changed_modules.outputs.result == ''
        run: mvn clean install -DskipTests -Dgithub.token=${{ secrets.GH_TOKEN }}
