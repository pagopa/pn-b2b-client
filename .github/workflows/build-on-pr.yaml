name: Build on PR

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for open PR
        id: pr_check
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
            });
            if (prs.data.length === 0) {
              core.setOutput('has_pr', 'false');
            } else {
              core.setOutput('has_pr', 'true');
            }

      - name: Detect changes in interop-qa-tests
        id: changes
        if: steps.pr_check.outputs.has_pr == 'true'
        run: |
          git fetch origin ${{ github.event.before }}
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^interop-qa-tests/'; then
            echo "run_in_qa_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_in_qa_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Maven
        if: steps.pr_check.outputs.has_pr == 'true'
        uses: s4u/setup-maven-action@v1.12.0
        with:
          java-version: 17
          maven-version: 3.9.8

      - name: Build interop-qa-tests module
        if: steps.pr_check.outputs.has_pr == 'true' && steps.changes.outputs.run_in_qa_tests == 'true'
        run: |
          cd interop-qa-tests
          mvn clean install -DskipTests

      - name: Build root project
        if: steps.pr_check.outputs.has_pr == 'true' && steps.changes.outputs.run_in_qa_tests == 'false'
        run: mvn clean install -DskipTests
