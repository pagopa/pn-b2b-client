spring.profiles.active=qa
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%5p} ${PID:-} --- %X{scenarioId:-N/A} --- [%15.15thread] %-40.40logger{1} : %msg%n

#TRACING
pn.interop.tracing.bearerToken-1=${interop.configuration.tracing.bearerToken-1}
pn.interop.tracing.bearerToken-2=${interop.configuration.tracing.bearerToken-2}
tracing.csv.errors.path=src/main/resources/tracing/
tracing.csv.tmp.path=src/main/resources/tracing/tmp-files/

#INTEROP GLOBAL PROPERTIES
max-polling-try-ms=50
max-polling-sleep-ms=1000
default.delay=${default.workflow.delay:2500}

# CONCURRENCY PROPERTIES
# Risoluzione temporale del report (in millisecondi)
scenarios.concurrency.report.bucket-ms=1000

# Configurazione Gruppo "exp"
scenarios.concurrency.groups.exp.tag=@concurrency-exp_vincolato
scenarios.concurrency.groups.exp.slots=1

# Configurazione Gruppo "exp2"
scenarios.concurrency.groups.exp2.tag=@concurrency-exp_vincolato2
scenarios.concurrency.groups.exp2.slots=1
