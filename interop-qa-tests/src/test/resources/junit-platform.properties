cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed

junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

#One for each feature file
#cucumber.execution.parallel.config.fixed.parallelism=39
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.execution-mode.feature=same_thread

cucumber.execution.exclusive-resources.noparallel.read-write=it.pagopa.interop.resources.NoParallelResources
cucumber.execution.exclusive-resources.certifiedAttribute.read-write=it.pagopa.interop.resources.CertifiedAttributeResources
cucumber.execution.exclusive-resources.deleghe1.read-write=it.pagopa.interop.resources.Deleghe1Resources
cucumber.execution.exclusive-resources.deleghe2.read-write=it.pagopa.interop.resources.Deleghe2Resources
cucumber.execution.exclusive-resources.reversePurpose.read-write=it.pagopa.interop.resources.ReversePurpose