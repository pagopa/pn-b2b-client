      it: "string Inviata tramite AVVISO DI AVVENUTA RICEZIONE notifichedigitali.it Hai ricevuto una comunicazione a valore legale da string con oggetto: string Accedi subito ai documenti online seguendo le istruzioni o, se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. OPZIONE 1: ACCEDI ORA AI DOCUMENTI ONLINE Consultazione online gratuita Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Se previsto un pagamento, puoi pagare con tutti i canali abilitati a pagoPA L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo OPZIONE 2: RITIRA I DOCUMENTI DI PERSONA Servizio di stampa a pagamento Puoi farlo tu o delegare una persona di fiducia. Segui le istruzioni sul retro del foglio. Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento OPZIONE 2: RITIRA I DOCUMENTI DI PERSONA Servizio di stampa a pagamento Cerca il Punto di ritiro SEND più vicino a te su Identificativo Univoco Notifica: notifichedigitali.it/punti-di-ritiro oppure chiama il string numero 06.9318.95.55 Codice fiscale: Recati al punto di ritiro portando con te: string questo avviso un tuo documento di riconoscimento il tuo codice fiscale un documento che attesti il tuo ruolo di legale rappresentante Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Vuoi che qualcuno ritiri i documenti per te? Io, Nome e Cognome La persona delegata dovrà portare con sé: questo avviso con la delega compilata e firmata in qualità di legale rappresentante di string string, un suo documento di riconoscimento delego il suo codice fiscale Nome e Cognome una copia o l'originale del codice fiscale e di un documento di riconoscimento del delegante Codice Fiscale un documento che attesti il ruolo di legale rappresentante del delegante a ritirare i documenti notificati. Firma COME SFRUTTARE TUTTI I VANTAGGI DI SEND - SERVIZIO NOTIFICHE DIGITALI? SEND è il servizio che semplifica l'invio delle comunicazioni a valore legale della Pubblica Amministrazione. Grazie a SEND puoi consultare le notifiche in digitale ed evitare le raccomandate e i relativi costi. Ti avvisiamo sui tuoi canali preferiti Consulta i documenti online Eviti i costi di raccomandata Aggiungi i tuoi recapiti per ricevere un avviso Accedi ai documenti online comodamente Se accedi in tempo, eviti l'invio della quando c'è una notifica per te dal tuo dispositivo raccomandata e i relativi costi Configura SEND accedendo alla tua area personale su: imprese.{%profile}.notifichedigitali.it"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Gesendet von Inviata tramite notifichedigitali.it Du hast eine rechtsgültige Mitteilung von | Hai ricevuto una comunicazione a valore legale da string mit dem Betreff | con oggetto: string erhalten Greife sofort online auf die Dokumente zu, indem du den Anweisungen folgst, oder, wenn du es vorziehst, hole die Dokumente in Papierform bei einer der SEND Abholstellen (CAF und andere vertraglich gebundene Betreiber) ab. Beachte, dass der Inhalt der Mitteilung dir gegenüber Rechtswirkungen entfaltet, auch wenn du die Dokumente nicht eingesehen hast. | Accedi subito ai documenti online seguendo le istruzioni, o se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. 1: GREIFE ONLINE AUF DIE DOKUMENTE ZU KOSTENLOS | ACCEDI AI DOCUMENTI ONLINE GRATIS Scanne den QR-Code mit der Kamera deines Geräts oder gehe zur Website imprese.{%profile}.notifichedigitali.it | Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Greife auf die Dokumente zu und lade sie herunter: sie enthalten wichtige Informationen für dich | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Ist eine Zahlung vorgesehen, können Sie online oder über die für pagoPA aktivierten Kanäle bezahlen. Der Betrag wird um die Zustellungskosten aktualisiert: 2 € für digitale Benachrichtigungen, höher für das Papier-Einschreiben, das nur bei Fehlen digitaler Kanäle versendet wird oder wenn Sie die Mitteilung nicht rechtzeitig öffnen | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Dieses Dokument ist eine rechtsgültige Mitteilung, mit der Sie aufgefordert werden, Einsicht in die Ihnen zugestellten Dokumente zu nehmen, die in jedem Fall Folgen für Sie haben werden. Ist eine Zahlung vorgesehen, hängt der zu zahlende Betrag von der Art und Weise ab, wie Sie auf die Zustellung zugreifen, von der Art des eventuell an Sie gesendeten und von der Körperschaft gewählten Einschreibens sowie von der Anzahl der Zustellversuche. Sie haben ab dem Datum, an dem die Zustellung rechtsgültig wird, 120 Tage Zeit, um online auf die Dokumente zuzugreifen oder sie persönlich abzuholen. Nach Ablauf der 120 Tage sind die Dokumente nicht mehr verfügbar und Sie müssen sich an die Körperschaft wenden, die sie Ihnen gesendet hat. Erfahren Sie mehr zur Berechnung der Fristen unter notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento 2: DIE DOKUMENTE PERSÖNLICH ABHOLEN | RITIRA I DOCUMENTI DI PERSONA Suchen Sie die nächste SEND Abholstelle unter Einheitlicher Kodex: notifichedigitali.it/punti-di-ritiro oder rufen Sie die Nummer Identificativo Univoco Notifica: 06.9318.95.55 | Cerca il Punto di ritiro SEND più vicino a te su string notifichedigitali.it/punti-di-ritiro oppure chiama il numero Steuernummer: 06.9318.95.55 Codice fiscale: Begeben Sie sich zur Abholstelle und bringen Sie mit | Recati al string punto di ritiro portando con te: diese Benachrichtigung | questo avviso ein Ausweisdokument | un tuo documento di riconoscimento Ihre Steuernummer | il tuo codice fiscale ein Dokument zum Nachweis Ihrer Rolle als gesetzlicher Vertreter | un documento che attesti il tuo ruolo di legale rappresentante Zahlen Sie 1,40 € (zzgl. MwSt., sofern anfallend) für den Druck und die Abholung der Dokumente. Eventuelle Kosten für zusätzliche Dienstleistungen des Händlers sind im Druck- und Abholservice nicht enthalten. | Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro Wenn eine pagoPA-Mitteilung vorliegt, kannst du über alle autorisierten Kanäle bezahlen. Der Betrag wird mit den Zustellungskosten aktualisiert: 2 € für die digitalen Zustellungen, höher für das Papier-Einschreiben, das nur bei Fehlen digitaler Kanäle oder wenn du die Mitteilung nicht rechtzeitig öffnest, gesendet wird | Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Möchten Sie, dass jemand die Dokumente für Sie abholt? | Vuoi che qualcuno ritiri i documenti per te? Ich | Io, Vor- und Nachname | Nome e Cognome Die bevollmächtigte Person muss Folgendes mitnehmen | La persona delegata dovrà portare con als gesetzlicher Vertreter von | in qualità di legale sé: rappresentante di string string, bevollmächtige | delego diese Empfangsbestätigung mit der ausgefüllten und unterzeichneten Vollmacht | questo avviso Vor- und Nachname | Nome e Cognome con la delega compilata e firmata ihren Personalausweis | un suo documento di Steuernummer | Codice Fiscale riconoscimento ihre Steuernummer | il suo codice fiscale die zugestellten Dokumente abzuholen | a ritirare i eine Kopie oder das Original der Steuernummer und eines Personalausweises des documenti notificati. Bevollmächtigenden | una copia o l'originale del codice fiscale e di un documento di Unterschrift | Firma riconoscimento del delegante ein Dokument, das die Funktion als gesetzlicher Vertreter des Bevollmächtigenden bescheinigt | un documento che attesti il ruolo di legale rappresentante del delegante"
      fr: "AVIS DE RÉCEPTION | AVVISO DI AVVENUTA RICEZIONE string Envoyé par Inviata tramite notifichedigitali.it Vous avez reçu une communication à valeur légale de | Hai ricevuto una comunicazione a valore legale da string avec pour objet | con oggetto: string Accédez immédiatement aux documents en ligne en suivant les instructions, ou si vous préférez, retirez les documents sous forme papier auprès de l'un des Points de retrait SEND (CAF et autres prestataires conventionnés). Veuillez noter que le contenu de la communication produira des effets juridiques à votre égard même sans que vous ayez pris connaissance des documents. | Accedi subito ai documenti online seguendo le istruzioni, o se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. 1: ACCÉDER AUX DOCUMENTS EN LIGNE GRATUIT | ACCEDI AI DOCUMENTI ONLINE GRATIS Scannez le code QR avec l'appareil photo de votre appareil ou rendez-vous sur le site web imprese.{%profile}.notifichedigitali.it | Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Accédez et téléchargez les documents : ils contiennent des informations importantes vous concernant | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Si un paiement est dû, vous pouvez payer en ligne ou via les canaux habilités pagoPA. Le montant sera mis à jour avec les frais de notification : 2 € pour les notifications numériques, plus élevés pour la lettre recommandée papier, envoyée uniquement en l'absence de canaux numériques ou si vous n'ouvrez pas la communication à temps | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Le présent document est une communication à valeur juridique vous invitant à prendre connaissance des documents qui vous sont notifiés et qui auront des conséquences à votre égard dans tous les cas. Si un paiement est dû, le montant à payer dépendra du mode choisi pour accéder à la notification, du type d'éventuelle lettre recommandée qui vous a été envoyée et choisie par l'organisme, et du nombre de tentatives de remise. Vous disposez de 120 jours à compter de la date à laquelle la notification devient légalement valide pour accéder aux documents en ligne ou les retirer en personne. Passé ce délai de 120 jours, les documents ne seront plus disponibles et vous devrez vous adresser à l'organisme qui vous les a envoyés. En savoir plus sur le calcul des délais sur notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento 2: RETIRER LES DOCUMENTS EN PERSONNE | RITIRA I DOCUMENTI DI PERSONA Trouvez le Point de retrait SEND le plus proche de vous sur Code IUN: notifichedigitali.it/punti-di-ritiro ou appelez le numéro Identificativo Univoco Notifica: 06.9318.95.55 | Cerca il Punto di ritiro SEND più vicino a te su string notifichedigitali.it/punti-di-ritiro oppure chiama il numero Code Fiscal: 06.9318.95.55 Codice fiscale: Rendez-vous au point de retrait muni de | Recati al punto di ritiro string portando con te: cet avis | questo avviso une pièce d'identité | un tuo documento di riconoscimento votre code fiscal | il tuo codice fiscale un document attestant votre rôle de représentant légal | un documento che attesti il tuo ruolo di legale rappresentante Payez 1,40 € (plus TVA si applicable) pour l'impression et le retrait des documents. Les frais éventuels pour des services supplémentaires fournis par le commerçant ne sont pas inclus dans le service d'impression et de retrait. | Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro Si un avis pagoPA est inclus, vous pouvez payer via tous les canaux activés. Le montant sera mis à jour avec les frais de notification : 2 € pour les notifications numériques, plus élevé pour la lettre recommandée papier, envoyée uniquement en l'absence de canaux numériques ou si vous n'ouvrez pas la communication à temps. | Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Voulez-vous que quelqu'un retire les documents pour vous ? | Vuoi che qualcuno ritiri i documenti per te? Je | Io, Prénom et nom | Nome e Cognome La personne désignée doit apporter | La persona delegata dovrà portare con sé: en tant que représentant légal de | in qualità di legale le présent accusé de réception avec la rappresentante di string string, délègue par la présente procuration remplie et signée | questo avviso con | delego la delega compilata e firmata sa pièce d'identité | un suo documento di Prénom et nom | Nome e Cognome riconoscimento son numéro d'identification fiscale | il suo codice Code fiscale | Codice Fiscale fiscale une copie ou l'original du code fiscal et une pièce d'identité de la personne délégante | una pour retirer les documents notifiés | a ritirare i copia o l'originale del codice fiscale e di un documenti notificati. documento di riconoscimento del delegante un document certifiant le rôle du délégant en Signature | Firma tant que représentant légal | un documento che attesti il ruolo di legale rappresentante del delegante"
      sl: "OBVESTILO O PREJEMU | AVVISO DI AVVENUTA RICEZIONE string Poslano od Inviata tramite notifichedigitali.it Prejeli ste uradno sporočilo od | Hai ricevuto una comunicazione a valore legale da string z zadevo | con oggetto: string Takoj dostopite do dokumentov na spletu, upoštevajoč navodila, ali, če želite, prevzemite dokumente v papirni obliki na enem od Prevzemnih mest SEND (CAF in drugi pooblaščeni izvajalci). Upoštevajte, da bo vsebina sporočila imela pravne učinke v zvezi z vami, tudi če dokumentov ne boste videli. | Accedi subito ai documenti online seguendo le istruzioni, o se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. 1: DOSTOP DO DOKUMENTOV NA SPLETU BREZPLAČNO | ACCEDI AI DOCUMENTI ONLINE GRATIS Optično preberite kodo QR s kamero vaše naprave ali pojdite na spletno stran imprese.{%profile}.notifichedigitali.it | Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Dostopajte do dokumentov in jih prenesite: vsebujejo pomembne informacije, ki se nanašajo na vas | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Če je predvideno plačilo, lahko plačate na spletu ali prek kanalov, ki omogočajo pagoPA. Znesek se bo posodobil s stroški vročitve: 2 € za digitalna obvestila, višji za priporočeno pismo v papirni obliki, poslano le v primeru odsotnosti digitalnih kanalov ali če sporočila ne odprete pravočasno | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Ta dokument je uradno sporočilo, ki vas vabi k seznanitvi z vročenimi dokumenti, ki bodo v vsakem primeru imeli za vas posledice. Če je predvideno plačilo, bo znesek za plačilo odvisen od načina dostopa do obvestila, vrste morebitnega priporočenega pisma, ki vam je bilo poslano in ga je izbral organ, ter števila poskusov vročitve. Imate 120 dni od datuma, ko obvestilo začne pravno veljati, za dostop do dokumentov na spletu ali osebni prevzem. Po preteku 120 dni dokumenti ne bodo več na voljo in se boste morali obrniti na organ, ki vam jih je poslal. Več o izračunu rokov izveste na notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento 2: PREVZEMITE DOKUMENTE OSEBNO | RITIRA I DOCUMENTI DI PERSONA Poiščite najbližje prevzemno mesto SEND na Edinstvena identifikacijska oznaka obvestila: notifichedigitali.it/punti-di-ritiro ali pokličite številko Identificativo Univoco Notifica: 06.9318.95.55 | Cerca il Punto di ritiro SEND più vicino a te su string notifichedigitali.it/punti-di-ritiro oppure chiama il numero Davčno Številko: 06.9318.95.55 Codice fiscale: Zglasite se na prevzemnem mestu in s seboj prinesite | Recati al string punto di ritiro portando con te: to obvestilo | questo avviso vaš osebni dokument | un tuo documento di riconoscimento vašo davčno številko | il tuo codice fiscale dokument, ki potrjuje vlogo pravnega zastopnika | un documento che attesti il tuo ruolo di legale rappresentante Plačajte 1,40 € (z DDV, če se obračuna) za tiskanje in prevzem dokumentov. Morebitni stroški za dodatne storitve, ki jih nudi trgovec, niso vključeni v storitev tiskanja in prevzema. | Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro Če je prisotno obvestilo pagoPA, lahko plačate preko vseh pooblaščenih kanalov. Znesek se bo posodobil s stroški vročanja: 2 € za digitalna vročanja, višji za priporočeno pošto v papirni obliki, poslano samo, če digitalni kanali niso na voljo ali če sporočila ne odprete pravočasno | Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Želite, da namesto vas dokumente prevzame nekdo drug? | Vuoi che qualcuno ritiri i documenti per te? Jaz | Io, Ime in priimek | Nome e Cognome Pooblaščena oseba mora s seboj prinesti | La persona delegata dovrà portare con sé: ikot pravni zastopnik | in qualità di legale to obvestilo z izpolnjenim in podpisanim rappresentante di string string, pooblaščam | delego pooblastilom | questo avviso con la delega compilata e firmata Ime in priimek | Nome e Cognome svoj osebni dokument | un suo documento di riconoscimento Davčna številka | Codice Fiscale svojo davčno številko | il suo codice fiscale kopijo ali izvirnik davčne številke in za prevzem vročenih dokumentov | a ritirare i identifikacijski dokument osebe, ki je podala pooblastilo | una copia o l'originale del codice documenti notificati. fiscale e di un documento di riconoscimento del delegante Podpis | Firma dokument, ki potrjuje vlogo pravnega zastopnika pooblastitelja | un documento che attesti il ruolo di legale rappresentante del delegante"
      en: "NOTICE OF RECEIPT | AVVISO DI AVVENUTA RICEZIONE string Sent via Inviata tramite notifichedigitali.it You have received a legally-binding communication from | Hai ricevuto una comunicazione a valore legale da string with subject | con oggetto: string Access the documents online now by following the instructions, or if you prefer, collect the documents in paper form at one of the SEND pickup points (CAF and other partner businesses). Please note that the content of the communication will produce legal effects for you even if you do not review it. | Accedi subito ai documenti online seguendo le istruzioni, o se preferisci, ritira i documenti in forma cartacea presso uno dei Punti di ritiro SEND (CAF e altri esercenti convenzionati). Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione. 1: ACCESS THE DOCUMENTS ONLINE FOR FREE | ACCEDI AI DOCUMENTI ONLINE GRATIS Scan the QR code with your device's camera or go to the website imprese.{%profile}.notifichedigitali.it | Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Log in and download the documents: they contain important information concerning you | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano If a payment is required, you can pay online or through pagoPA-enabled channels. The amount will be updated with notification costs: €2 for digital notifications, higher for registered post, which is only sent if no digital channels are available or if you do not open the communication in time | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo This document is a legally-binding communication inviting you to review the documents notified to you, which will have consequences for you in any case. If a payment is required, the amount to be paid will depend on the method you choose to access the notification, the type of registered post sent to you as chosen by the institution, and the number of delivery attempts. You have 120 days from the date on which the notification becomes legally valid to access the documents online or pick them up in person. After 120 days, the documents will no longer be available and you will have to contact the institution that sent them. Find out more about how to calculate the timing at notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online o ritirarli di persona. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento 2: PICK UP THE DOCUMENTS IN PERSON | RITIRA I DOCUMENTI DI PERSONA Find the SEND pickup point nearest to you at IUN (unique notification identifier): notifichedigitali.it/punti-di-ritiro or call 06.9318.95.55 | Cerca il Identificativo Univoco Notifica: Punto di ritiro SEND più vicino a te su string notifichedigitali.it/punti-di-ritiro oppure chiama il numero Fiscal Code: 06.9318.95.55 Codice fiscale: Go to the pickup point bringing with you | Recati al punto di ritiro string portando con te: this notice | questo avviso your identity document | un tuo documento di riconoscimento your fiscal code | il tuo codice fiscale a document certifying your role as legal representative | un documento che attesti il tuo ruolo di legale rappresentante Pay €1.40 (plus VAT if applicable) for printing and document collection. Any costs for additional services rendered by the business are not included in the printing and collection service | Paga 1,40 € (più IVA se prevista) per la stampa e il ritiro dei documenti. Eventuali spese per servizi aggiuntivi resi dall'esercente non sono inclusi nel servizio di stampa e ritiro If a pagoPA notice is present, you can pay through all enabled channels. The amount will be updated with notification costs: €2 for digital notifications, higher for registered post, which is only sent if no digital channels are available or if you do not open the communication in time. | Se presente un avviso pagoPA, puoi pagare con tutti i canali abilitati. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Do you want someone to pick up the documents for you? | Vuoi che qualcuno ritiri i documenti per te? I | Io, First and Last Name | Nome e Cognome The delegated person must bring with them | La persona delegata dovrà portare con sé: as legal representative of | in qualità di legale this notice with the delegation section rappresentante di string string, hereby delegate | completed and signed | questo avviso con la delego delega compilata e firmata their identity document | un suo documento di First and Last Name | Nome e Cognome riconoscimento their fiscal code | il suo codice fiscale Fiscal Code | Codice Fiscale a copy or the original of the fiscal code and an identity document of the delegating party | una copia o l'originale del codice fiscale e di un to pick up the notified documents | a ritirare i documento di riconoscimento del delegante documenti notificati. a document certifying the role of legal representative of the delegating party | un Signature | Firma documento che attesti il ruolo di legale rappresentante del delegante"

  aar-no-radd:
    pf:
      it: "string Inviata tramite AVVISO DI AVVENUTA Identificativo Univoco Notifica: RICEZIONE string Codice fiscale: string notifichedigitali.it Hai ricevuto una comunicazione a valore legale da string con oggetto: string Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCEDI ORA AI DOCUMENTI ONLINE Consultazione online gratuita Inquadra il codice QR con l'app IO o con la fotocamera del tuo dispositivo In alternativa vai sul sito web cittadini.{%profile}.notifichedigitali.it Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Se previsto un pagamento, puoi pagare con tutti i canali abilitati a pagoPA L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Vuoi che qualcuno acceda ai documenti online per te? Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto. Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento COME SFRUTTARE TUTTI I VANTAGGI DI SEND - SERVIZIO NOTIFICHE DIGITALI? SEND è il servizio che semplifica l'invio delle comunicazioni a valore legale della Pubblica Amministrazione. Grazie a SEND puoi consultare le notifiche in digitale ed evitare le raccomandate e i relativi costi. Ti avvisiamo sui tuoi canali preferiti Consulta i documenti online Eviti i costi di raccomandata Aggiungi i tuoi recapiti per ricevere un avviso Accedi ai documenti online comodamente Se accedi in tempo, eviti l'invio della quando c'è una notifica per te dal tuo dispositivo raccomandata e i relativi costi Configura SEND accedendo alla tua area personale su: cittadini.{%profile}.notifichedigitali.it QUESTO AVVISO È STATO CHIARO? FACCI SAPERE COSA NE PENSI La tua opinione ci permette di migliorare continuamente ciò che offriamo. La compilazione richiede pochi istanti. Raccontaci la tua esperienza al link notifichedigitali.it/sondaggi"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Gesendet von Inviata tramite Einheitlicher Kodex: Identificativo Univoco Notifica: string Steuernummer | Codice fiscale: string notifichedigitali.it Du hast eine rechtsgültige Mitteilung von | Hai ricevuto una comunicazione a valore legale da string mit dem Betreff | con oggetto: string erhalten Nimm Kenntnis von der Kopie der beigefügten Dokumente oder greife online auf die Originaldokumente zu gemäß den Anweisungen. Beachte, dass der Inhalt der Mitteilung Rechtswirkungen für dich entfaltet, auch ohne dass du die Dokumente zur Kenntnis nimmst. | Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. GREIFE ONLINE AUF DIE DOKUMENTE ZU KOSTENLOS | ACCEDI AI DOCUMENTI ONLINE GRATIS Scanne den QR-Code mit der App IO oder mit der Kamera deines Geräts. Alternativ gehe zur Website cittadini.{%profile}.notifichedigitali.it | Inquadra il codice QR con l'app IO o con la fotocamera del tuo dispositivo. In alternativa vai sul sito web cittadini.{%profile}.notifichedigitali.it Greife auf die Dokumente zu und lade sie herunter: sie enthalten wichtige Informationen für dich | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Ist eine Zahlung vorgesehen, können Sie online oder über die für pagoPA aktivierten Kanäle bezahlen. Der Betrag wird um die Zustellungskosten aktualisiert: 2 € für digitale Benachrichtigungen, höher für das Papier-Einschreiben, das nur bei Fehlen digitaler Kanäle versendet wird oder wenn Sie die Mitteilung nicht rechtzeitig öffnen | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Dieses Dokument ist eine rechtsgültige Mitteilung, die dich dazu auffordert, die dir zugestellten Dokumente zur Kenntnis zu nehmen. Diese entfalten in jedem Fall Rechtswirkungen für dich. Ist eine Zahlung vorgesehen, hängt der zu zahlende Betrag von der Zugangsart ab, die du für die Zustellung wählst, der Art des dir möglicherweise zugesandten und von der Körperschaft gewählten Einschreibens sowie der Anzahl der Zustellversuche. Du hast 120 Tage ab dem Datum, an dem die Zustellung Rechtsgültigkeit erlangt, um auf die Dokumente online zuzugreifen. Nach Ablauf dieser 120 Tage sind die Dokumente nicht mehr verfügbar, und du musst dich an die Körperschaft wenden, die sie dir zugesandt hat. Erfahre mehr darüber, wie du die Fristen berechnest unter notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento Wenn du einen elektronischen Personalausweis (CIE) hast, kannst du eine Vertrauensperson bitten, für dich online auf die Dokumente zuzugreifen. Sie muss lediglich den QR-Code mit IO scannen und den Anweisungen in der App folgen, um die Dokumente in deinem Namen einzusehen. | Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto."
      fr: "AVIS DE RÉCEPTION | AVVISO DI AVVENUTA RICEZIONE string Envoyé par Inviata tramite Code IUN: Identificativo Univoco Notifica: string Code Fiscal | Codice fiscale: string notifichedigitali.it Vous avez reçu une communication à valeur légale de | Hai ricevuto una comunicazione a valore legale da string avec pour objet | con oggetto: string Consultez la copie des documents joints ou accédez aux documents originaux en ligne en suivant les instructions. Veuillez noter que le contenu de la communication produira des effets juridiques à votre égard, même sans que vous ayez consulté les documents. | Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCÉDER AUX DOCUMENTS EN LIGNE GRATUIT | ACCEDI AI DOCUMENTI ONLINE GRATIS Scannez le code QR avec l'appli IO ou l'appareil photo de votre appareil. Vous pouvez également vous rendre sur le site web cittadini.{%profile}.notifichedigitali.it | Inquadra il codice QR con l'app IO o con la fotocamera del tuo dispositivo. In alternativa vai sul sito web cittadini.{%profile}.notifichedigitali.it Accédez et téléchargez les documents : ils contiennent des informations importantes vous concernant | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Si un paiement est dû, vous pouvez payer en ligne ou via les canaux habilités pagoPA. Le montant sera mis à jour avec les frais de notification : 2 € pour les notifications numériques, plus élevés pour la lettre recommandée papier, envoyée uniquement en l'absence de canaux numériques ou si vous n'ouvrez pas la communication à temps | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Ce document est une communication à valeur légale qui vous invite à prendre connaissance des documents qui vous ont été notifiés et qui produiront des conséquences à votre égard dans tous les cas. Si un paiement est prévu, le montant à payer dépendra du mode que vous choisissez pour accéder à la notification, du type d'éventuelle lettre recommandée qui vous a été envoyée et choisie par l'organisme, et du nombre de tentatives de remise. Vous disposez de 120 jours à compter de la date à laquelle la notification prend effet légal pour accéder aux documents en ligne. Passé ce délai de 120 jours, les documents ne seront plus disponibles et vous devrez vous adresser à l'organisme qui vous les a envoyés. Pour en savoir plus sur le calcul des délais, consultez notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento Si tu as une Carte d'Identité Électronique (CIE), tu peux demander à une personne de confiance d'accéder aux documents en ligne pour toi. Il lui suffit de scanner le code QR avec IO et de suivre les instructions sur l'application pour consulter les documents pour ton compte. | Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto."
      sl: "OBVESTILO O PREJEMU | AVVISO DI AVVENUTA RICEZIONE string Poslano od Inviata tramite Edinstvena identifikacijska oznaka obvestila: Identificativo Univoco Notifica: string Davčno Številko | Codice fiscale: string notifichedigitali.it Prejeli ste uradno sporočilo od | Hai ricevuto una comunicazione a valore legale da string z zadevo | con oggetto: string Preglejte kopijo priloženih dokumentov ali dostopajte do izvirnih dokumentov na spletu po navodilih. Upoštevajte, da bo vsebina sporočila imela pravne učinke za vas, tudi če si dokumentov ne boste ogledali. | Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. DOSTOP DO DOKUMENTOV NA SPLETU BREZPLAČNO | ACCEDI AI DOCUMENTI ONLINE GRATIS Optično preberite kodo QR z aplikacijo IO ali s kamero vaše naprave. Lahko pa obiščete spletno stran cittadini.{%profile}.notifichedigitali.it | Inquadra il codice QR con l'app IO o con la fotocamera del tuo dispositivo. In alternativa vai sul sito web cittadini.{%profile}.notifichedigitali.it Dostopajte do dokumentov in jih prenesite: vsebujejo pomembne informacije, ki se nanašajo na vas | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Če je predvideno plačilo, lahko plačate na spletu ali prek kanalov, ki omogočajo pagoPA. Znesek se bo posodobil s stroški vročitve: 2 € za digitalna obvestila, višji za priporočeno pismo v papirni obliki, poslano le v primeru odsotnosti digitalnih kanalov ali če sporočila ne odprete pravočasno | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Ta dokument je uradno sporočilo, ki vas vabi k pregledu dokumentov, ki so vam bili vročeni in ki bodo v vsakem primeru imeli pravne posledice za vas. Če je predvideno plačilo, bo znesek plačila odvisen od načina, ki ga izberete za dostop do obvestila, od vrste morebitnega priporočenega pisma, ki vam ga pošlje in izbere organ, in od števila poskusov vročitve. Imate 120 dni od datuma, ko obvestilo postane pravno veljavno, za dostop do dokumentov na spletu. Po preteku 120 dni dokumenti ne bodo več na voljo in se boste morali obrniti na organ, ki vam jih je poslal. Izvedite več o tem, kako izračunati roke na notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento Če imaš elektronsko osebno izkaznico (CIE), lahko prosiš zaupno osebo, da namesto tebe dostopa do dokumentov na spletu. Vse, kar mora storiti, je, da z aplikacijo IO optično prebere kodo QR in sledi navodilom v aplikaciji za vpogled v dokumente v tvojem imenu. | Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto."
      en: "NOTICE OF RECEIPT | AVVISO DI AVVENUTA RICEZIONE string Sent via Inviata tramite Unique notification identifier: Identificativo Univoco Notifica: string Fiscal Code | Codice fiscale: string notifichedigitali.it You have received a legally-binding communication from | Hai ricevuto una comunicazione a valore legale da string with subject | con oggetto: string Review the copy of the attached documents or access the original documents online by following the instructions. Please note that the content of the communication will produce legal effects for you even if you do not review the documents. | Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCESS THE DOCUMENTS ONLINE FOR FREE | ACCEDI AI DOCUMENTI ONLINE GRATIS Scan the QR code with the IO app or your device's camera. Alternatively, go to the website cittadini.{%profile}.notifichedigitali.it | Inquadra il codice QR con l'app IO o con la fotocamera del tuo dispositivo. In alternativa vai sul sito web cittadini.{%profile}.notifichedigitali.it Log in and download the documents: they contain important information concerning you | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano If a payment is required, you can pay online or through pagoPA-enabled channels. The amount will be updated with notification costs: €2 for digital notifications, higher for registered post, which is only sent if no digital channels are available or if you do not open the communication in time | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo This document is a legally-binding communication inviting you to review the documents notified to you, which will have consequences for you in any case. If a payment is required, the amount to be paid will depend on the method you choose to access the notification, the type of registered post sent to you as chosen by the institution, and the number of delivery attempts. You have 120 days from the date on which the notification becomes legally valid to access the documents online. After 120 days, the documents will no longer be available and you will have to contact the institution that sent them. Find out more about how to calculate the timing at notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento If you have an Electronic ID card (CIE), you can ask a person you trust to access the online documents for you. They simply need to scan the QR code with IO and follow the instructions on the app to consult the documents on your behalf. | Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto."

