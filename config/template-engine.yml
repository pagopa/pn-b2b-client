relativi costi. Ti avvisiamo sui tuoi canali preferiti Consulta i documenti online Eviti i costi di raccomandata Aggiungi i tuoi recapiti per ricevere un avviso Accedi ai documenti online comodamente Se accedi in tempo, eviti l'invio della quando c'è una notifica per te dal tuo dispositivo raccomandata e i relativi costi Configura SEND accedendo alla tua area personale su: imprese.{%profile}.notifichedigitali.it"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Gesendet von Inviata tramite Einheitlicher Kodex: Identificativo Univoco Notifica: string Steuernummer | Codice fiscale: string notifichedigitali.it Du hast eine rechtsgültige Mitteilung von | Hai ricevuto una comunicazione a valore legale da string mit dem Betreff | con oggetto: string erhalten Nimm Kenntnis von der Kopie der beigefügten Dokumente oder greife online auf die Originaldokumente zu gemäß den Anweisungen. Beachte, dass der Inhalt der Mitteilung Rechtswirkungen für dich entfaltet, auch ohne dass du die Dokumente zur Kenntnis nimmst. | Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. GREIFE ONLINE AUF DIE DOKUMENTE ZU KOSTENLOS | ACCEDI AI DOCUMENTI ONLINE GRATIS Scanne den QR-Code mit der Kamera deines Geräts oder gehe zur Website imprese.{%profile}.notifichedigitali.it | Inquadra il codice QR con la fotocamera del tuo dispositivo oppure vai sul sito web imprese.{%profile}.notifichedigitali.it Greife auf die Dokumente zu und lade sie herunter: sie enthalten wichtige Informationen für dich | Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano Ist eine Zahlung vorgesehen, können Sie online oder über die für pagoPA aktivierten Kanäle bezahlen. Der Betrag wird um die Zustellungskosten aktualisiert: 2 € für digitale Benachrichtigungen, höher für das Papier-Einschreiben, das nur bei Fehlen digitaler Kanäle versendet wird oder wenn Sie die Mitteilung nicht rechtzeitig öffnen | Se previsto un pagamento, puoi pagare online o presso i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo Dieses Dokument ist eine rechtsgültige Mitteilung, die dich dazu auffordert, die dir zugestellten Dokumente zur Kenntnis zu nehmen. Diese entfalten in jedem Fall Rechtswirkungen für dich. Ist eine Zahlung vorgesehen, hängt der zu zahlende Betrag von der Zugangsart ab, die du für die Zustellung wählst, der Art des dir möglicherweise zugesandten und von der Körperschaft gewählten Einschreibens sowie der Anzahl der Zustellversuche. Du hast 120 Tage ab dem Datum, an dem die Zustellung Rechtsgültigkeit erlangt, um auf die Dokumente online zuzugreifen. Nach Ablauf dieser 120 Tage sind die Dokumente nicht mehr verfügbar, und du musst dich an die Körperschaft wenden, die sie dir zugesandt hat. Erfahre mehr darüber, wie du die Fristen berechnest unter notifichedigitali.it/perfezionamento | Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su notifichedigitali.it/perfezionamento"
