messages:
  aar-radd:
    pf:
      it: "string AVVISO DI AVVENUTA RICEZIONE Identificativo Univoco Notifica: string Codice fiscale: string Inviata tramite notifichedigitali.it Hai ricevuto una comunicazione a valore legale da string con oggetto: string Prendi visione della copia dei documenti allegati o accedi ai documenti originali online seguendo le istruzioni. Tieni presente che il contenuto della comunicazione produrrà effetti giuridici nei tuoi confronti anche senza la tua presa visione dei documenti. ACCEDI ORA AI DOCUMENTI ONLINE Consultazione online gratuita Inquadra il codice QR con l'app IO o la fotocamera del tuo dispositivo. In alternativa vai sul sito web string Accedi e scarica i documenti: contengono informazioni importanti che ti riguardano. Se previsto un pagamento, puoi pagare con tutti i canali abilitati a pagoPA. L'importo si aggiornerà con i costi di notifica: 2 € per le notifiche digitali, più elevati per la raccomandata cartacea, inviata solo in assenza di canali digitali o se non apri la comunicazione in tempo. Vuoi che qualcuno acceda ai documenti online per te? Se hai una Carta d'Identità Elettronica (CIE) puoi chiedere a una persona di fiducia di accedere ai documenti online per te. Non deve far altro che inquadrare il codice QR con IO e seguire le istruzioni sull'app per consultare i documenti per tuo conto. Il presente documento è una comunicazione a valore legale che ti invita a prendere visione dei documenti a te notificati e che avranno conseguenze nei tuoi confronti in ogni caso. Se previsto un pagamento, l'importo da pagare dipenderà dalla modalità che scegli per accedere alla notifica, dalla tipologia dell'eventuale raccomandata a te inviata e scelta dall'ente, dal numero di tentativi di recapito. Hai 120 giorni dalla data in cui la notifica assume valore di legge per accedere ai documenti online. Trascorsi i 120 giorni, i documenti non saranno più disponibili e dovrai rivolgerti all'ente che te li ha inviati. Scopri di più su come calcolare i tempi su www.string"
      de: "EMPFANGSBESTÄTIGUNG | AVVISO DI AVVENUTA RICEZIONE string Eindeutiger Benachrichtigungsbezeichner: Identificativo Univoco Notifica: string Steuernummer | Codice fiscale: string Gesendet von Inviata tramite notifichedigitali.it Sie haben eine rechtliche Mitteilung von string mit dem Betreff string erhalten. Sehen Sie sich die Kopie der beigefügten Dokumente an oder greifen Sie online auf die Originaldokumente zu, indem Sie die Anweisungen befolgen. Bitte beachten Sie, dass der Inhalt der Mitteilung auch ohne Einsichtnahme in die Dokumente Rechtswirkungen gegenüber Ihnen entfaltet. Kostenloser Online-Zugriff auf Dokumente. Scannen Sie den QR-Code mit der IO-App oder der Kamera Ihres Geräts. Alternativ besuchen Sie die Website string. Zugang zu Dokumenten und Download: Sie enthalten wichtige Informationen über Sie. Falls eine Zahlung erforderlich ist, können Sie diese über die PagoPA-fähigen Kanäle vornehmen. Der Betrag richtet sich nach den Benachrichtigungskosten: 2 € für digitale Benachrichtigungen, höher für papierbasierte Einschreiben. Ab dem Tag, an dem der Bescheid rechtskräftig wird, haben Sie 120 Tage Zeit, um die Dokumente online abzurufen. Weitere Informationen finden Sie unter string"
      fr: "AVIS DE RÉCEPTION | AVVISO DI AVVENUTA RICEZIONE string Code IUN: Identificativo Univoco Notifica: string Code fiscal: Codice fiscale: string Envoyé par Inviata tramite notifichedigitali.it Vous avez reçu une communication à valeur légale de string avec pour objet string. Consultez la copie des documents joints ou accédez aux documents originaux en ligne en suivant les instructions. Veuillez noter que le contenu de la communication produira des effets juridiques à votre égard, même sans consultation des documents."
      sl: "OBVESTILO O PREJEMU | AVVISO DI AVVENUTA RICEZIONE string Enolični identifikator obvestila: Identificativo Univoco Notifica: string Davčna številka: Codice fiscale: string Poslano prek Inviata tramite notifichedigitali.it Prejeli ste uradno sporočilo od string z zadevo string. Preglejte kopijo priloženih dokumentov ali dostopajte do izvirnih dokumentov na spletu po navodilih."

